    $(document).ready(function () {
    function ticker() {
      var tickerElement = $('ul.ticker');
      var listItemWidth = tickerElement.find('li').first().outerWidth(true); // Width of one list item including margin
      var animation;

      function startTicker() {
        // Ensure there's no ongoing animation
        if (animation) {
          animation.stop(true, true);
        }
        animation = tickerElement.animate({
          marginLeft: -listItemWidth
        }, 6000, 'linear', function () {
          tickerElement.css({
            marginLeft: 0
          }).find('li:first').appendTo(tickerElement);
          startTicker();
        });
      }

      tickerElement.find('li').hover(
        function () {
          // On mouse enter, stop the animation
          tickerElement.stop(true);
        },
        function () {
          // On mouse leave, resume the animation only if not already running
          startTicker();
        }
      );

      startTicker();
    }

    ticker();
  });
    
  </script>
